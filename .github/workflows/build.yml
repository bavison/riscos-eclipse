name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Language server tests
        run: asmindex/test.sh

      - name: For the screenshots, a font with control pictures (the editors show a NUL as ␀), and WebKit for hovers
        run: sudo apt-get install -y -q fonts-symbola libwebkit2gtk-4.1-0 || true

      - name: Eclipse update site, and the plugins tested in a headless Eclipse
        run: |
          # The update site is signed with PGP if the secrets are set.
          if [ -n "$SECRET_PGP_KEYS" ]; then
            if [ -z "$SECRET_PGP_PASSPHRASE" ]; then
              echo "::error::The secret PGP_SECRET_KEYS is set, but PGP_PASSPHRASE isn't: add the key's passphrase as that secret."
              exit 1
            fi
            printf '%s\n' "$SECRET_PGP_KEYS" > "$RUNNER_TEMP/pgp.asc"
            export PGP_SECRET_KEYS_FILE="$RUNNER_TEMP/pgp.asc" PGP_PASSPHRASE="$SECRET_PGP_PASSPHRASE"
          fi
          xvfb-run -a mvn -B -ntp verify -Dmaven.test.failure.ignore=true
        env:
          OBJASM_INDEX_TRACE: "1"
          SECRET_PGP_KEYS: ${{ secrets.PGP_SECRET_KEYS }}
          SECRET_PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

      - name: Headless Eclipse error log
        if: always()
        run: |
          log=$(find eclipse-tests/target -path '*/.metadata/.log' | head -1)
          if [ -n "$log" ]; then tail -n 300 "$log"; else echo "no error log"; fi
          for f in $(find eclipse-tests/target -path '*languageServers-log*' -name '*Messages.log' 2>/dev/null) \
                   $(find eclipse-tests/target -name objasm-index.log 2>/dev/null); do
            echo "== $f"; grep -E " (<-|->) " "$f" | grep -vE 'progress|riscos/status' | head -150
          done

      - name: Headless Eclipse test results
        if: always()
        run: |
          for f in eclipse-tests/target/surefire-reports/*.xml; do
            [ -e "$f" ] || { echo "no test reports"; exit 1; }
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          bad = 0
          for c in r.iter('testcase'):
              f = c.find('failure') if c.find('failure') is not None else c.find('error')
              print(('FAIL ' if f is not None else 'ok   ') + c.get('name') + ('  ' + (f.get('message') or '')[:400] if f is not None else ''))
              bad += f is not None
          sys.exit(1 if bad else 0)
          PY
          done

      - name: List update site
        run: |
          echo "PGP-signed artifacts: $(unzip -p site/target/repository/artifacts.jar | grep -c 'pgp.signatures' || true)"
          find site/target/repository -type f | sort
          for j in site/target/repository/plugins/*.jar; do echo "== $j"; unzip -l "$j"; done
          echo "== objasm-index.jar"; unzip -l eclipse-lsp/server/objasm-index.jar | grep -v '\.class$'
          java -jar eclipse-lsp/server/objasm-index.jar buildscan 2>&1 | head -2 || true

      - name: Upload the user guide's screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: user-guide-screenshots
          path: eclipse-tests/target/screenshots/
          if-no-files-found: warn

      - name: Upload update site
        uses: actions/upload-artifact@v5
        with:
          name: riscos-eclipse
          path: site/target/repository/
          if-no-files-found: error

  # The update site, published on GitHub Pages for Eclipse to install from and
  # check for updates. Only from main, and only once the repository variable
  # PUBLISH_SITE is "true" (with Settings › Pages › Source set to GitHub Actions).
  publish-site:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_SITE == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: riscos-eclipse
          path: site
      - name: The site as a zip too, for installing without the address
        run: (cd site && zip -qr "$RUNNER_TEMP/riscos-eclipse.zip" .) && mv "$RUNNER_TEMP/riscos-eclipse.zip" site/
      - name: A page for anyone who opens the address in a browser
        run: cp .github/pages/index.html site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
